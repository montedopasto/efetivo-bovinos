<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BOVITRACK — Alocação TV</title>

<link rel="stylesheet" href="styles.css">

<style>
:root{
  --bg:#f3f7f4;
  --panel:#ffffff;
  --green:#2f9e44;
  --dark:#0f172a;
  --muted:#64748b;
  --line:#dbe4dc;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:
    radial-gradient(circle at 15% 20%, #dcfce7 0%, transparent 45%),
    radial-gradient(circle at 85% 30%, #bbf7d0 0%, transparent 45%),
    var(--bg);
  color:var(--dark);
}

nav{
  padding:14px 26px;
  background:#e6f4ea;
  border-bottom:1px solid #d9e3dc;
}

nav a{
  color:#475569;
  text-decoration:none;
  margin-right:22px;
  font-weight:700;
}

.header{
  display:flex;
  align-items:center;
  gap:24px;
  padding:26px 34px;
  background:#d1fae5;
  border-bottom:1px solid #bbf7d0;
}

.logo{
  height:72px;
}

.header h1{
  margin:0;
  font-size:30px;
  font-weight:900;
}

.header-right{
  margin-left:auto;
  text-align:right;
}

.clock{
  font-size:34px;
  font-weight:900;
}

.date-control{
  margin:28px 34px;
  padding:20px;
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  display:flex;
  align-items:center;
  gap:18px;
}

.date-control label{
  font-size:18px;
  font-weight:800;
}

.date-control input{
  font-size:18px;
  padding:10px 14px;
  border-radius:12px;
  border:1px solid #cbd5e1;
}

.table-wrap{
  margin:0 34px 34px;
  background:transparent;
}

.aloc-table{
  width:100%;
  border-collapse:separate;
  border-spacing:0 8px;
  table-layout:fixed;
}

.aloc-table thead tr:first-child th{
  background:#15803d;
  color:white;
  font-size:18px;
  padding:12px;
}

.aloc-table thead tr:nth-child(2) th{
  background:#22c55e;
  color:#052e16;
  font-size:16px;
  padding:8px;
}

.aloc-table th:first-child{
  width:38%;
  text-align:left;
  padding-left:22px !important;
}

.aloc-table th{
  text-align:center;
  font-weight:950;
  border:none;
}

.aloc-table tbody tr{
  background:white;
  box-shadow:0 6px 18px rgba(15,23,42,.08);
}

.aloc-table tbody tr:nth-child(even){
  background:#f0fdf4;
}

.aloc-table td{
  padding:11px 14px;
  font-size:19px;
  font-weight:850;
  text-align:center;
  border:none;
}

.aloc-table td:first-child{
  text-align:left;
  font-size:20px;
  font-weight:950;
  padding-left:22px;
  color:#0f172a;
  border-left:8px solid #22c55e;
}

.aloc-table td:nth-child(2),
.aloc-table td:nth-child(3),
.aloc-table td:nth-child(4){
  color:#0f172a;
}

.aloc-table td:nth-child(5){
  color:#15803d;
  font-weight:950;
}

.aloc-table td:nth-child(6){
  color:#1d4ed8;
  font-weight:950;
}

.aloc-table td:nth-child(7){
  color:#c2410c;
  font-weight:950;
}

.total-row{
  background:#bbf7d0 !important;
  box-shadow:0 8px 22px rgba(21,128,61,.18) !important;
}

.total-row td{
  font-size:21px;
  font-weight:950;
  border-top:3px solid #15803d;
}

.empty{
  margin:34px;
  padding:28px;
  background:white;
  border-radius:20px;
  border:1px solid var(--line);
  font-size:20px;
  font-weight:800;
}

@media(max-height:850px){
  .header{
    padding:14px 28px;
  }

  .logo{
    height:54px;
  }

  .header h1{
    font-size:24px;
  }

  .clock{
    font-size:26px;
  }

  .date-control{
    margin:16px 34px;
    padding:12px 18px;
  }

  .aloc-table th{
    font-size:15px;
    padding:7px 10px;
  }

  .aloc-table td{
    font-size:16px;
    padding:6px 10px;
  }

  .total-row td{
    font-size:17px;
  }
}
</style>
</head>

<body>

<nav>
  <a href="index.html">Dashboard</a>
  <a href="animais.html">Animais</a>
  <a href="planeamento.html">Planeamento</a>
  <a href="ranking.html">Ranking</a>
  <a href="alocacao.html">Alocação</a>
</nav>

<div class="header">
  <img src="logo-monte-do-pasto.png" class="logo">

  <div>
    <h1>BOVITRACK — Dashboard TV de Alocação</h1>
    <div id="stamp"></div>
  </div>

  <div class="header-right">
    <div id="clock" class="clock">--:--</div>
    <div id="dataHoje"></div>
  </div>
</div>

<div class="date-control">
  <label>Data de previsão:</label>
  <input type="date" id="dataPrevisao">
</div>

<div id="output" class="table-wrap"></div>

<script src="core.js"></script>

<script>
const output = document.getElementById("output");
const dataInput = document.getElementById("dataPrevisao");

function hojeISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

dataInput.value = hojeISO();

function diasEntre(dataBase, dataDestino){
  const d1 = new Date(dataBase);
  const d2 = new Date(dataDestino);

  d1.setHours(0,0,0,0);
  d2.setHours(0,0,0,0);

  return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
}

function valorAnimal(a, nomes){
  for(const n of nomes){
    if(a[n] !== undefined && a[n] !== null && a[n] !== ""){
      return a[n];
    }
  }
  return null;
}

function numero(v){
  if(v === null || v === undefined) return NaN;
  return Number(String(v).replace(",", ".").replace("kg","").trim());
}

function pesoEstimadoNaData(a, dataDestino){

  const pesoAtual = numero(
    valorAnimal(a, [
      "pesoAtual",
      "peso_atual",
      "peso",
      "pesoAtualKg"
    ])
  );

  const gmd = numero(
    valorAnimal(a, [
      "gmd",
      "GMD",
      "gmdReal",
      "avgGmd"
    ])
  );

  const dataPeso =
    valorAnimal(a, [
      "dataAtual",
      "dataPeso",
      "data_peso",
      "dataPesagemAtual"
    ]);

  if(!Number.isFinite(pesoAtual)){
    return NaN;
  }

  if(!Number.isFinite(gmd) || !dataPeso){
    return pesoAtual;
  }

  const dias = diasEntre(dataPeso, dataDestino);

  return pesoAtual + (gmd * dias);
}

function render(){

  output.innerHTML = "";

  const state = Core.loadState();

  const animais = state?.animalsOut || [];

  if(!animais.length){
    output.innerHTML = `
      <div class="empty">
        Sem dados carregados. Volta ao Dashboard e sincroniza o Google Sheets.
      </div>
    `;
    return;
  }

  const dataDestino = dataInput.value || hojeISO();

  const grupos = {};

  animais.forEach(a => {

    const alocacao =
      valorAnimal(a, [
        "alocacao",
        "Alocacao",
        "ALOCACAO",
        "alocação",
        "Alocação"
      ]) || "Sem alocação";

    if(!grupos[alocacao]){
      grupos[alocacao] = {
        nome:alocacao,
        m:0,
        f:0,
        total:0,
        pesoM:[],
        pesoF:[],
        pesoTotal:[]
      };
    }

    const sexo = String(a.sexo || "").toUpperCase();
    const pesoPrevisto = pesoEstimadoNaData(a, dataDestino);

    grupos[alocacao].total++;

    if(Number.isFinite(pesoPrevisto)){
      grupos[alocacao].pesoTotal.push(pesoPrevisto);
    }

    if(sexo === "M"){
      grupos[alocacao].m++;

      if(Number.isFinite(pesoPrevisto)){
        grupos[alocacao].pesoM.push(pesoPrevisto);
      }
    }
    else if(sexo === "F"){
      grupos[alocacao].f++;

      if(Number.isFinite(pesoPrevisto)){
        grupos[alocacao].pesoF.push(pesoPrevisto);
      }
    }

  });

  const lista = Object.values(grupos)
  .sort((a,b)=>
    String(a.nome || "")
      .toLowerCase()
      .localeCompare(
        String(b.nome || "").toLowerCase(),
        "pt"
      )
  );
const LINHAS_POR_PAGINA = 12;

window.alocacoesTV =
  lista;

window.paginaAtual =
  window.paginaAtual || 0;

const totalPaginas =
  Math.ceil(
    lista.length /
    LINHAS_POR_PAGINA
  );

const inicio =
  window.paginaAtual *
  LINHAS_POR_PAGINA;

const fim =
  inicio +
  LINHAS_POR_PAGINA;

const listaPagina =
  lista.slice(
    inicio,
    fim
  );
const media = arr =>
  arr.length
    ? Math.round(arr.reduce((s,v)=>s+v,0) / arr.length)
    : "—";

const totalGeral = {
  m:0,
  f:0,
  total:0,
  pesoM:[],
  pesoF:[],
  pesoTotal:[]
};

lista.forEach(g => {
  totalGeral.m += g.m;
  totalGeral.f += g.f;
  totalGeral.total += g.total;
  totalGeral.pesoM.push(...g.pesoM);
  totalGeral.pesoF.push(...g.pesoF);
  totalGeral.pesoTotal.push(...g.pesoTotal);
});

output.innerHTML = `
  <table class="aloc-table">
    <thead>
      <tr>
        <th rowspan="2">Alocação</th>
        <th colspan="3">Quantidade</th>
        <th colspan="3">Peso estimado na data</th>
      </tr>
      <tr>
        <th>M</th>
        <th>F</th>
        <th>Total</th>
        <th>M</th>
        <th>F</th>
        <th>Global</th>
      </tr>
    </thead>

    <tbody>
      ${listaPagina.map(g => `
        <tr>
          <td>${g.nome}</td>
          <td class="num">${g.m}</td>
          <td class="num">${g.f}</td>
          <td class="num">${g.total}</td>
          <td class="peso">${media(g.pesoM)} kg</td>
          <td class="peso">${media(g.pesoF)} kg</td>
          <td class="peso">${media(g.pesoTotal)} kg</td>
        </tr>
      `).join("")}

      <tr class="total-row">
        <td>Total</td>
        <td class="num">${totalGeral.m}</td>
        <td class="num">${totalGeral.f}</td>
        <td class="num">${totalGeral.total}</td>
        <td class="peso">${media(totalGeral.pesoM)} kg</td>
        <td class="peso">${media(totalGeral.pesoF)} kg</td>
        <td class="peso">${media(totalGeral.pesoTotal)} kg</td>
      </tr>
    </tbody>
  </table>
`;

}

dataInput.addEventListener("change", render);

function startClock(){
  const clock = document.getElementById("clock");
  const dataHoje = document.getElementById("dataHoje");

  function tick(){
    const now = new Date();

    clock.textContent = now.toLocaleTimeString("pt-PT", {
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    });

    dataHoje.textContent = now.toLocaleDateString("pt-PT");
  }

  tick();
  setInterval(tick,1000);
}

startClock();
render();
setInterval(()=>{

  if(!window.alocacoesTV) return;

  const totalPaginas =
    Math.ceil(
      window.alocacoesTV.length / 12
    );

  window.paginaAtual =
    (window.paginaAtual + 1) %
    totalPaginas;

  render();

},10000);  
</script>

</body>
</html>
